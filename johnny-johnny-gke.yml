workflow: cloud_workflow

release:
  name: johnny-platform-release
  version: 1.0.0

  desired_state:
    environment: present
    applications: deployed

  applications:

    spring:
      - name: johnny-johnny-backend
        repo: https://github.com/ggortsema/johnny-johnny.git
        branch: main
        version: 1.0.0

        build:
          type: maven-docker
          project_path: .
          module_path: chat-api
          dockerfile: chat-api/Dockerfile
          docker_context: .

        artifacts:
          - type: docker-image
            image: us-east1-docker.pkg.dev/styxcd-sandbox-grant/styxcd-sandbox/johnny-johnny-backend:latest

      - name: johnny-johnny-backend-2
        repo: https://github.com/ggortsema/johnny-johnny.git
        branch: main
        version: 1.0.0

        build:
          type: maven-docker
          project_path: .
          module_path: chat-api
          dockerfile: chat-api/Dockerfile
          docker_context: .

        artifacts:
          - type: docker-image
            image: us-east1-docker.pkg.dev/styxcd-sandbox-grant/styxcd-sandbox/johnny-johnny-backend:latest

    node:
      - name: johnny-johnny-ui
        repo: https://github.com/ggortsema/johnny-johnny-ui.git
        branch: main
        version: 1.0.0

        build:
          type: docker
          project_path: .
          dockerfile: Dockerfile
          docker_context: .

        artifacts:
          - type: docker-image
            image: us-east1-docker.pkg.dev/styxcd-sandbox-grant/styxcd-sandbox/johnny-johnny-ui:latest

  environments:
    sandbox:
      - name: johnny-johnny-gke-sandbox
        platform:
          name: gke
          project_id: styxcd-sandbox-grant
          cluster_name: styxcd-sandbox-gke
          location: us-east1-b
          location_type: zonal
          namespace: johnny-johnny

          credentials:
            source: jenkins
            id: gcp-service-account

          defaults:
            replicas: 1
            service:
              type: ClusterIP

          ingress:
            enabled: true
            name: johnny-johnny-ingress
            host: johnny-johnny.styxcd.com
            class_name: gce
            routes:
              - path: /
                path_type: Prefix
                service: johnny-johnny-ui
                port: 80

              - path: /api
                path_type: Prefix
                service: johnny-johnny-backend
                port: 80

          dns:
            enabled: true
            provider: route53
            hosted_zone: styxcd.com
            record_name: johnny-johnny.styxcd.com.
            record_type: A
            ttl: 300
            credentials:
              source: jenkins
              access_key_id: aws-access-key-id
              secret_access_key: aws-secret-access-key

          applications:
            - name: johnny-johnny-backend
              container:
                port: 8080
              service:
                port: 80
                target_port: 8080
              secrets:
                - env_name: OPENAI_API_KEY
                  source:
                    type: jenkins-credential
                    credential_id: openai-api-key

            - name: johnny-johnny-ui
              container:
                port: 3000
              service:
                port: 80
                target_port: 3000